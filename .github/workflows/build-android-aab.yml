name: Build NhacMix signed Android AAB
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-aab.yml'
permissions:
  contents: read
jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Configure app icon assets
        run: |
          npm install --no-save @capacitor/assets
          mkdir -p assets
          npx capacitor-assets generate --android
      - name: Sync Android project
        run: npx cap sync android
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nhacmix-release.jks"
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          cat >> android/gradle.properties <<EOF2
          NHACMIX_STORE_FILE=$RUNNER_TEMP/nhacmix-release.jks
          NHACMIX_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          NHACMIX_KEY_ALIAS=$ANDROID_KEY_ALIAS
          NHACMIX_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'signingConfigs {' not in s:
              s=s.replace('    buildTypes {', '''    signingConfigs {
        release {
            storeFile file(project.property("NHACMIX_STORE_FILE"))
            storePassword project.property("NHACMIX_STORE_PASSWORD")
            keyAlias project.property("NHACMIX_KEY_ALIAS")
            keyPassword project.property("NHACMIX_KEY_PASSWORD")
        }
    }
    buildTypes {''')
          s=s.replace('release {\n            minifyEnabled', 'release {\n            signingConfig signingConfigs.release\n            minifyEnabled')
          p.write_text(s)
          PY
      - name: Build signed release AAB
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease
      - name: Verify bundle exists
        run: test -s android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: NhacMix-release-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
